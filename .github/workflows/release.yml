# Baut das Docs-Image und veröffentlicht es auf GHCR bei jedem Push auf main.
#
# Tags:
#   ghcr.io/mandarioss/docs:main              (beweglich)
#   ghcr.io/mandarioss/docs:main-<shortsha>   (unveränderlich, wird deployt)
name: Release

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/mandarioss/docs

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - name: GHCR-Login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image-Tags berechnen
        id: tags
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "tags=${IMAGE}:${GITHUB_REF_NAME},${IMAGE}:${GITHUB_REF_NAME}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
