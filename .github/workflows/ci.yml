# Prüfung jedes Pushs und Pull Requests: strikter MkDocs-Build, interne Links, llms.txt,
# Docker-Build und die Antworten des nginx-Containers (Doku-Seiten, Weiterleitungen).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DISABLE_MKDOCS_2_WARNING: "true"

jobs:
  build:
    name: Build & Link-Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # vollständige Historie für "Zuletzt aktualisiert"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Strikter Build
        run: mkdocs build --strict

      - name: Interne Links prüfen (offline)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --root-dir "${{ github.workspace }}/site" "site/**/*.html"
          fail: true

      - name: llms.txt prüfen
        run: python tests/llms_txt.py --site site

      - name: Docker-Image bauen (ohne Push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: docs:ci

      - name: nginx-Konfiguration prüfen
        run: docker run --rm docs:ci nginx -t

      - name: Doku-Seiten und Weiterleitungen im Container prüfen
        run: |
          docker run -d --name docs-ci -p 8080:8080 docs:ci
          python tests/nginx_pfade.py --basis http://127.0.0.1:8080 --site site

      - name: Container-Log bei Fehler
        if: failure()
        run: docker logs docs-ci || true
