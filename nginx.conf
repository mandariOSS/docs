server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;
    server_tokens off;

    # Textdateien wie llms.txt enthalten Umlaute
    charset utf-8;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 1024;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK";
    }

    # Adressen der Anwendung (Bürgerportal Insight, OParl-API), die Suchmaschinen noch
    # unter docs.mandari.de kennen, dauerhaft auf mandari.de weiterleiten. Die echten
    # Doku-Seiten /insight/, /insight/beschluesse/, /insight/dokumente/,
    # /insight/oparl-api/, /insight/ratsfragen/ und die alte Doku-Adresse /oparl/ bleiben
    # unberührt. index.html ist ausgenommen, weil nginx /verzeichnis/ intern auf
    # /verzeichnis/index.html umleitet und diese Regeln dabei erneut prüft.
    # Die CI prüft die Regeln gegen tests/nginx_pfade.txt und jede gebaute Seite.
    location ~ ^/insight/(?:vorgaenge|termine|personen|gremien|fragen|sitzungen|k|kommune|suche|karte)(?:/|$) {
        return 301 https://mandari.de$request_uri;
    }

    # Beschlüsse und Dokumente gibt es auch als Doku-Seite: nur mit Kennungssegment weiterleiten
    location ~ ^/insight/(?:beschluesse|dokumente)/(?!index\.html$)[^/] {
        return 301 https://mandari.de$request_uri;
    }

    location ~ ^/oparl/(?!index\.html$). {
        return 301 https://mandari.de$request_uri;
    }

    # Eigenes Stylesheet hat keinen Hash im Namen: nicht lange cachen, sonst sehen
    # Besucher nach einem Design-Update tagelang das alte CSS
    location ^~ /stylesheets/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Theme-Assets tragen einen Hash im Namen und dürfen länger gecacht werden
    location ~* \.(css|js|woff2?|png|jpe?g|gif|svg|ico|webp)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
