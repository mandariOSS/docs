server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;
    server_tokens off;

    # Textdateien wie llms.txt enthalten Umlaute
    charset utf-8;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 1024;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK";
    }

    # Adressen der Anwendung (Bürgerportal Insight, OParl-API), die Suchmaschinen noch
    # unter docs.mandari.de kennen, dauerhaft auf mandari.de weiterleiten. Die echten
    # Doku-Seiten /insight/, /insight/beschluesse/, /insight/dokumente/,
    # /insight/oparl-api/, /insight/ratsfragen/ und die alte Doku-Adresse /oparl/ bleiben
    # unberührt. index.html ist ausgenommen, weil nginx /verzeichnis/ intern auf
    # /verzeichnis/index.html umleitet und diese Regeln dabei erneut prüft.
    # Die CI prüft die Regeln gegen tests/nginx_pfade.txt und jede gebaute Datei.
    # Alles unter /insight/ außer den Doku-Seiten selbst (auch Abos, Chat, Merkliste, Nachbarschaft
    # usw., die Suchmaschinen aus der Zeit kennen, als docs.mandari.de die Anwendung auslieferte).
    # Beschlüsse und Dokumente gibt es auch als Doku-Seite: weitergeleitet wird dort nur mit
    # Kennungssegment.
    location ~ ^/insight/(?!(?:beschluesse|dokumente|oparl-api|ratsfragen)/?(?:index\.html)?$|index\.html$)[^/] {
        return 301 https://mandari.de$request_uri;
    }

    # Fehlertypen der Schnittstellen (RFC 9457): Die Anwendung nennt in jeder Fehlerantwort
    # https://docs.mandari.de/api/probleme/<typ>. Die Übersicht ist eine Doku-Seite, jeder Typ ein
    # Abschnitt darauf; die Adresse eines Typs springt dorthin. ^~ hält die Regel für /api/ unten fern.
    location = /api/probleme {
        return 301 /api/probleme/;
    }
    location ^~ /api/probleme/ {
        add_header Cache-Control "no-cache";
        location ~ ^/api/probleme/([a-z0-9-]+)/?$ {
            return 301 "/api/probleme/#$1";
        }
        try_files $uri $uri/ =404;
    }

    # Konten, API und öffentliche Protokolle der Anwendung (keine Doku-Seiten unter diesen Pfaden)
    location ~ ^/(?:accounts|api|public)(?:/|$) {
        return 301 https://mandari.de$request_uri;
    }

    # Unter /work/ und /session/ liegen Doku-Seiten: nur Pfade ohne Doku-Datei gehen an die Anwendung
    location ~ ^/(?:work|session)/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ @anwendung;
    }
    location @anwendung {
        return 301 https://mandari.de$request_uri;
    }

    # Frühere Seiten der Website, die Suchmaschinen noch unter docs.mandari.de kennen
    location ~ ^/team/?$ {
        return 301 https://mandari.de/unternehmen/;
    }
    location ~ ^/faq/?$ {
        return 301 https://mandari.de/kontakt/;
    }

    # Umbenannte Doku-Seiten: „Crawler und Opt-out“ heißt seit Oktober 2026 „Ingestor und Opt-out“
    # (mandari#1061). Relativ, damit die Weiterleitung auf docs.mandari.de bleibt.
    location ~ ^/datenschutz/crawler(?:/(?:index\.html)?)?$ {
        return 301 /datenschutz/ingestor/;
    }

    location ~ ^/oparl/(?!index\.html$). {
        return 301 https://mandari.de$request_uri;
    }

    # Eigenes Stylesheet hat keinen Hash im Namen: nicht lange cachen, sonst sehen
    # Besucher nach einem Design-Update tagelang das alte CSS
    location ^~ /stylesheets/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Theme-Assets tragen einen Hash im Namen und dürfen länger gecacht werden
    location ~* \.(css|js|woff2?|png|jpe?g|gif|svg|ico|webp)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
